name: Build ChikiChou LK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi git python3 python-is-python3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install liblk || true
          fi

      - name: Build ChikiChou
        run: |
          make clean
          make

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chikichou-fogorow-${{ github.run_number }}
          name: ChikiChou fogorow build ${{ github.run_number }}
          files: |
            build/lk-patched.img
            payload/build/payload.bin